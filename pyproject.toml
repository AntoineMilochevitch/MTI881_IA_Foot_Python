[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-rl"
version = "0.1.0"
description = "Backend PyTorch pour l'entraînement RL d'un jeu de football 3D Unity."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium==1.3.0",
    "numpy==2.5.3",
    "torch==2.14.0",
    "tensorboard==2.21.0",
]

[project.scripts]
football-rl-train = "football_rl.train:main"

[tool.setuptools.packages.find]
where = ["src"]
